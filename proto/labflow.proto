syntax = "proto3";

package labflow.v1;

option go_package = "github.com/labflow/host-service/gen/labflow/v1;labflowv1";

// ─── Session / Collaboration ──────────────────────────────────────────────────

message Session {
  string session_id = 1;
  string owner_key  = 2;   // SHA-256 hex of the API key
  repeated string peer_ids = 3;
  int64  created_at = 4;   // Unix timestamp (seconds)
}

message JoinRequest {
  string session_id = 1;
  string api_key    = 2;   // raw key — validated server-side
}

message JoinResponse {
  bool   accepted   = 1;
  string token      = 2;   // short-lived JWT for this session
  string message    = 3;
}

// ─── Agent Tasks ─────────────────────────────────────────────────────────────

message TaskRequest {
  string task_id    = 1;
  string session_id = 2;
  string payload    = 3;   // JSON-encoded task parameters
  int32  priority   = 4;
}

message TaskResponse {
  string task_id    = 1;
  string result     = 2;   // JSON-encoded result
  TaskStatus status = 3;
  string error      = 4;
}

message ExecuteCodeRequest {
  string session_id = 1;
  string code       = 2;   // Python or Wasm code string
  string language   = 3;   // e.g., "python", "wasm"
  uint64 max_memory = 4;   // Max memory limit in bytes
  uint64 max_cpu    = 5;   // CPU / Fuel limit
}

message ExecuteCodeResponse {
  bool   success    = 1;
  string output     = 2;   // stdout or execution result
  string error      = 3;   // stderr or error message
  uint64 memory_used_bytes = 4;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING     = 1;
  TASK_STATUS_RUNNING     = 2;
  TASK_STATUS_DONE        = 3;
  TASK_STATUS_FAILED      = 4;
}

// ─── Sandbox I/O bridge ──────────────────────────────────────────────────────

message SandboxWriteRequest {
  string session_id = 1;
  uint64 offset     = 2;
  bytes  data       = 3;
}

message SandboxReadRequest {
  string session_id = 1;
  uint64 offset     = 2;
  uint32 size       = 3;
}

message SandboxReadResponse {
  bytes data  = 1;
  bool  ok    = 2;
  string error = 3;
}

// ─── Services ────────────────────────────────────────────────────────────────

service HostService {
  // Key validation & session management
  rpc JoinSession(JoinRequest) returns (JoinResponse);

  // Dispatch a task to the agent runtime
  rpc SubmitTask(TaskRequest)  returns (TaskResponse);

  // Binary sandbox I/O (delegated to core-engine via FFI)
  rpc SandboxWrite(SandboxWriteRequest) returns (SandboxReadResponse);
  rpc SandboxRead (SandboxReadRequest)  returns (SandboxReadResponse);
}

service AgentService {
  // Host → Agent: push a task
  rpc ExecuteTask(TaskRequest) returns (stream TaskResponse);

  // Host → Agent: push code for isolated execution
  rpc ExecuteCode(ExecuteCodeRequest) returns (ExecuteCodeResponse);

  // Bidirectional stream for UI events and analysis results
  rpc AgentEventStream(stream AgentEventRequest) returns (stream AgentEventResponse);
}

// ─── CRDT Trackable Structures ───────────────────────────────────────────────

message ChartState {
  string chart_id = 1;
  string type = 2;
  bytes data = 3; // Binary payload of chart data
}

message ChemicalStructure {
  string structure_id = 1;
  string format = 2; // e.g., "SMILES", "MOL"
  string payload = 3;
}

message MarkdownAST {
  string document_id = 1;
  string root_node = 2; // JSON representation of the AST
}

message DeltaMutation {
  string target_id = 1;
  bytes delta_data = 2; // Optimized difference data for vectors/matrices
}

message AgentEventRequest {
  string session_id = 1;
  string event_type = 2; // e.g., "CANVAS_CLICK", "PARAMETER_CHANGE"
  bytes payload = 3;
}

message AgentEventResponse {
  string session_id = 1;
  string response_type = 2; // e.g., "ANALYSIS_RESULT", "CODE_GENERATION"
  bytes payload = 3;
}


// CRDT Operations
message CrdtOperation {
    enum OpType {
        INSERT = 0;
        DELETE = 1;
        UPDATE = 2;
    }
    OpType op_type = 1;
    string id = 2;        // Unique id of the character/element
    string parent_id = 3; // To establish tree structure or sequence
    uint32 index = 4;     // For arrays/strings
    string value = 5;     // Content to insert/update
}

message CrdtDeltaChunk {
    string document_id = 1;
    repeated CrdtOperation operations = 2;
}
