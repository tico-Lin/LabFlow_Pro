[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labflow-pro"
version = "0.3.0"
description = "LabFlow Pro — 現代化科學數據視覺化與分析平台"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
authors = [{name = "LabFlow Team"}]

dependencies = [
    "PySide6>=6.5",
    "pyqtgraph>=0.13",
    "h5py>=3.9",
    "numpy>=1.24",
    "scipy>=1.11",
    "chardet>=5.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "pytest-cov>=4.1",
    "mypy>=1.5",
    "ruff>=0.1",
]

[project.scripts]
labflow = "labflow.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/labflow", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 100
target-version = "py310"
